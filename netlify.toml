# Netlify page (web/): a static Vite build that calls Sleeper and ESPN from the
# browser. No functions, no database, no secrets. The old Next.js app at the
# repo root is not built or deployed by Netlify.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Runs from web/. By default Netlify only rebuilds when web/ changes, but the
  # engine lives in ../lib, so watch that too. Exit 0 skips the build: each
  # production deploy costs 15 of the free plan's 300 monthly credits. With no
  # previous build to compare against (first deploy) or a redeploy of the same
  # commit, always build.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../lib ../db/types.ts ../netlify.toml'

[build.environment]
  NODE_VERSION = "22"
  # Netlify sees the old Next.js app at the repo root and adds its Next.js
  # plugin by default, which then fails because web/dist isn't Next.js output.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
